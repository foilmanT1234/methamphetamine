<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2b1d0c;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 偽のロード画面のスタイル */
    .fake-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #140d05;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    .loading-title {
      font-size: 2rem;
      color: #f7d070;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px #000;
    }

    .loading-bar-container {
      width: 300px;
      height: 20px;
      background-color: #2b1d0c;
      border: 2px solid #5c3e1e;
      border-radius: 10px;
      overflow: hidden;
      padding: 2px;
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a66a20, #f7d070);
      border-radius: 6px;
      transition: width 0.1s linear;
    }

    .loading-text {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #c0a080;
    }

    /* 最上部：ニュースティッカーバー */
    .news-bar {
      height: 36px;
      background-color: #140d05;
      border-bottom: 2px solid #5c3e1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: relative;
      z-index: 100;
    }

    /* 画面一番左上の見えないデバッグトリガーボタン */
    .debug-trigger {
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 36px;
      cursor: pointer;
      z-index: 200;
    }

    .news-content {
      flex: 1;
      font-size: 0.9rem;
      color: #e2b774;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
      transition: color 0.2s;
    }

    .news-content:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* 右上のボタン群エリア */
    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ボタン共通スタイル */
    .control-btn, .lang-btn {
      background: #3b2611;
      color: #f7d070;
      border: 1px solid #6b4723;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .control-btn:hover, .lang-btn:hover {
      background: #5c3e1e;
    }

    /* メインコンテンツエリア（左右分割） */
    .game-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 36px);
      position: relative;
    }

    /* 左側：クッキーメインエリア */
    .left-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #4a3319 0%, #1a1005 100%);
      border-right: 4px solid #5c3e1e;
      position: relative;
      padding: 20px;
    }

    .bakery-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: #e2b774;
      margin-bottom: 12px;
      cursor: pointer;
      text-decoration: underline dotted #a66a20;
      transition: color 0.2s, transform 0.1s;
      text-shadow: 1px 1px 3px #000;
    }

    .bakery-name:hover {
      color: #fff;
      transform: scale(1.03);
    }

    .stats {
      text-align: center;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 30px;
      border-radius: 12px;
      border: 1px solid #6b4723;
    }

    .cookie-count {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f7d070;
      text-shadow: 2px 2px 4px #000;
    }

    .cps-count {
      font-size: 1.1rem;
      color: #c0a080;
      margin-top: 5px;
    }

    .cookie-button {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, #e0a353 0%, #a66a20 70%, #6e410b 100%);
      border: 8px solid #d48c37;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      position: relative;
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cookie-button:active {
      transform: scale(0.95);
    }

    /* クッキーのチョコチップ模様 */
    .chip {
      position: absolute;
      background-color: #3d2309;
      border-radius: 40%;
    }
    .chip:nth-child(1) { width: 30px; height: 25px; top: 40px; left: 60px; transform: rotate(15deg); }
    .chip:nth-child(2) { width: 25px; height: 30px; top: 120px; left: 40px; transform: rotate(-20deg); }
    .chip:nth-child(3) { width: 35px; height: 28px; top: 70px; right: 50px; transform: rotate(45deg); }
    .chip:nth-child(4) { width: 28px; height: 28px; bottom: 45px; right: 70px; transform: rotate(10deg); }
    .chip:nth-child(5) { width: 32px; height: 22px; top: 110px; left: 105px; transform: rotate(-10deg); }

    /* ゴールデンクッキーのスタイル */
    .golden-cookie {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7cc 0%, #ffd700 70%, #cca100 100%);
      border: 6px solid #ffee55;
      box-shadow: 0 0 25px #ffd700, inset 0 0 15px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      z-index: 600;
      animation: gcPulse 1.2s infinite alternate;
      transition: transform 0.1s;
    }

    .golden-cookie:hover {
      transform: scale(1.1);
    }

    @keyframes gcPulse {
      0% { box-shadow: 0 0 15px #ffd700; }
      100% { box-shadow: 0 0 30px #ffffff, 0 0 10px #ffea75; }
    }

    @keyframes gcFadeOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.2);
      }
    }

    .golden-cookie.fade-out {
      animation: gcFadeOut 0.5s ease-out forwards;
      pointer-events: none;
    }

    /* バフ表示エリアのスタイル */
    .buff-display {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 1px 1px 2px #000;
      min-height: 24px;
    }

    /* クリック時浮き出るテキストアニメーション */
    .click-number {
      position: absolute;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000, 0 0 8px #f7d070;
      pointer-events: none;
      animation: floatUpFade 0.8s ease-out forwards;
      z-index: 700;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-50px) scale(1.2);
      }
    }

    /* 右側：施設・アップグレードショップエリア */
    .right-pane {
      width: 420px;
      background-color: #1f1408;
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      padding: 12px;
      background-color: #3b2611;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 2px solid #5c3e1e;
      color: #f7d070;
    }

    .shop-tabs {
      display: flex;
      background-color: #140d05;
      border-bottom: 2px solid #5c3e1e;
    }

    .shop-tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      background-color: #2b1d0c;
      color: #a08060;
      border-bottom: 3px solid transparent;
      transition: background-color 0.2s, color 0.2s;
    }

    .shop-tab:hover {
      background-color: #3b2611;
      color: #fff;
    }

    .shop-tab.active {
      background-color: #1f1408;
      color: #f7d070;
      border-bottom: 3px solid #f7d070;
    }

    .upgrades-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background-color: #170d04;
      border-bottom: 2px solid #5c3e1e;
      min-height: 60px;
      align-items: center;
    }

    .upgrades-container:empty::before {
      content: attr(data-empty-text);
      color: #7a5a3a;
      font-size: 0.85rem;
      width: 100%;
      text-align: center;
    }

    .upgrade-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #d4a359 0%, #8c5a20 100%);
      border: 2px solid #f7d070;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, filter 0.2s;
      position: relative;
    }

    .upgrade-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .upgrade-btn.disabled {
      opacity: 0.4;
      filter: grayscale(0.8);
      cursor: pointer;
    }

    .shop-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .shop-list::-webkit-scrollbar {
      width: 10px;
    }
    .shop-list::-webkit-scrollbar-track {
      background: #140d05;
    }
    .shop-list::-webkit-scrollbar-thumb {
      background: #5c3e1e;
      border-radius: 5px;
    }

    .building-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2e1d0c;
      border: 2px solid #4a3014;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .building-item:hover {
      background: #3d2812;
      border-color: #7a5022;
    }

    .building-item.disabled {
      opacity: 0.5;
      background: #1a1006;
      border-color: #2a1a0a;
      cursor: pointer;
    }

    .building-info {
      display: flex;
      flex-direction: column;
    }

    .building-name {
      font-weight: bold;
      font-size: 1.05rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .building-icon {
      font-size: 1.2rem;
    }

    .building-cost {
      font-size: 0.9rem;
      color: #f7d070;
      margin-top: 3px;
    }

    .building-cps {
      font-size: 0.8rem;
      color: #a08060;
      margin-top: 2px;
    }

    .building-count {
      font-size: 1.5rem;
      font-weight: bold;
      color: #8c6338;
      min-width: 40px;
      text-align: right;
    }

    .building-item:not(.disabled) .building-count {
      color: #d4a359;
    }

    .falling-icon {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      z-index: 999;
      will-change: transform, top, left;
    }

    .lang-modal-overlay, .debug-modal-overlay, .save-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lang-modal, .debug-modal, .save-modal {
      background: #2b1d0c;
      border: 3px solid #f7d070;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      max-width: 450px;
      width: 90%;
    }

    .lang-modal h2, .debug-modal h2, .save-modal h2 {
      font-size: 1.4rem;
      color: #f7d070;
      margin-bottom: 20px;
    }

    .lang-modal-buttons, .debug-modal-buttons, .save-modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .lang-select-btn, .debug-btn, .save-action-btn {
      background: linear-gradient(135deg, #d4a359 0%, #8c5a20 100%);
      color: #fff;
      border: 2px solid #f7d070;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }

    .lang-select-btn:hover, .debug-btn:hover, .save-action-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    .debug-input-group, .save-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .debug-input-group label, .save-input-group label {
      font-size: 0.9rem;
      color: #e2b774;
    }

    .debug-input-group input, .debug-input-group select, .save-input-group textarea {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #6b4723;
      background: #140d05;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      resize: vertical;
    }

    .debug-input-group input:focus, .debug-input-group select:focus, .save-input-group textarea:focus {
      border-color: #f7d070;
    }
  </style>
</head>
<body>

  <!-- 偽のロード画面 -->
  <div class="fake-loading-screen" id="loading-screen">
    <div class="loading-title">🍪 Loading Cookie Clicker...</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill" id="loading-bar-fill"></div>
    </div>
    <div class="loading-text" id="loading-text">Preparing dough... 0%</div>
  </div>

  <!-- 言語選択モーダルポップアップ -->
  <div class="lang-modal-overlay" id="lang-modal" style="display: none;">
    <div class="lang-modal">
      <h2>Select Language / 言語選択</h2>
      <div class="lang-modal-buttons">
        <button class="lang-select-btn" onclick="selectInitialLanguage('ja')">日本語</button>
        <button class="lang-select-btn" onclick="selectInitialLanguage('en')">English</button>
      </div>
    </div>
  </div>

  <!-- デバッグ用モーダル -->
  <div class="debug-modal-overlay" id="debug-modal" style="display: none;">
    <div class="debug-modal">
      <h2 id="debug-title">🛠️ Debug Menu</h2>
      <div class="debug-input-group">
        <label for="debug-cookies-input" id="debug-label-cookies">Cookies:</label>
        <input type="number" id="debug-cookies-input" min="0" step="any">
        
        <label for="debug-cps-input" id="debug-label-cps">CPS:</label>
        <input type="number" id="debug-cps-input" min="0" step="any">

        <label for="debug-gc-select" id="debug-label-gc">Golden Cookie Effect:</label>
        <select id="debug-gc-select">
          <option value="frenzy">Frenzy (CPS ×7)</option>
          <option value="clickFrenzy">Click Frenzy (Click ×777)</option>
        </select>
      </div>
      <div class="debug-modal-buttons" style="flex-wrap: wrap;">
        <button class="debug-btn" id="debug-btn-spawn-gc" onclick="spawnDebugGoldenCookie()">Spawn GC</button>
        <button class="debug-btn" id="debug-btn-apply" onclick="applyDebugSettings()">Apply</button>
        <button class="debug-btn" id="debug-btn-close" style="background: #5a2020;" onclick="closeDebugMenu()">Close</button>
      </div>
    </div>
  </div>

  <!-- セーブ出力 (Export Save) モーダル -->
  <div class="save-modal-overlay" id="export-modal" style="display: none;">
    <div class="save-modal">
      <h2 id="export-modal-title">Export Save</h2>
      <div class="save-input-group">
        <label id="export-label-desc">Copy your save string below:</label>
        <textarea id="export-string-output" rows="5" readonly></textarea>
      </div>
      <div class="save-modal-buttons">
        <button class="save-action-btn" id="export-btn-copy" onclick="copySaveString()">Copy</button>
        <button class="save-action-btn" style="background: #5a2020;" id="export-btn-close" onclick="closeExportModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- セーブ読込 (Import Save) モーダル -->
  <div class="save-modal-overlay" id="import-modal" style="display: none;">
    <div class="save-modal">
      <h2 id="import-modal-title">Import Save</h2>
      <div class="save-input-group">
        <label id="import-label-desc">Paste your save string below:</label>
        <textarea id="import-string-input" rows="5" placeholder="Paste here..."></textarea>
      </div>
      <div class="save-modal-buttons">
        <button class="save-action-btn" id="import-btn-paste" onclick="pasteSaveString()">Paste</button>
        <button class="save-action-btn" id="import-btn-load" onclick="loadSaveString()">Load</button>
        <button class="save-action-btn" style="background: #5a2020;" id="import-btn-close" onclick="closeImportModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- 最上部：ニュースエリア & 言語切り替え -->
  <div class="news-bar">
    <div class="debug-trigger" id="debug-trigger" onclick="openDebugMenu()"></div>
    <div class="news-content" id="news-ticker" title="Click to view next news">Loading news...</div>
    <div class="top-right-controls">
      <button class="control-btn" id="export-save-btn" onclick="openExportModal()">Export Save</button>
      <button class="control-btn" id="import-save-btn" onclick="openImportModal()">Import Save</button>
      <button class="lang-btn" id="lang-toggle-btn">日本語</button>
    </div>
  </div>

  <!-- メインゲームエリア -->
  <div class="game-container" id="game-container">
    <!-- 左パネル：クッキーとカウント -->
    <div class="left-pane" id="left-pane">
      <div class="bakery-name" id="bakery-name" title="Click to rename">Player's bakery</div>
      <div class="stats">
        <div class="cookie-count" id="cookies">0 cookies</div>
        <div class="cps-count" id="cps">per second: 0</div>
        <div class="buff-display" id="buff-display"></div>
      </div>
      <div class="cookie-button" id="cookie-btn">
        <div class="chip"></div>
        <div class="chip"></div>
        <div class="chip"></div>
        <div class="chip"></div>
        <div class="chip"></div>
      </div>
    </div>

    <!-- 右パネル：施設・アップグレードショップ -->
    <div class="right-pane">
      <div class="pane-header" id="upgrade-header">Upgrades</div>
      <div class="upgrades-container" id="upgrades-container"></div>

      <div class="pane-header" id="shop-header">Buildings</div>
      <div class="shop-tabs">
        <div class="shop-tab active" id="tab-buy" onclick="setShopMode('buy')">Buy</div>
        <div class="shop-tab" id="tab-sell" onclick="setShopMode('sell')">Sell</div>
      </div>
      <div class="shop-list" id="shop-list"></div>
    </div>
  </div>

  <script>
    let loadProgress = 0;
    const loadFill = document.getElementById('loading-bar-fill');
    const loadText = document.getElementById('loading-text');
    const loadScreen = document.getElementById('loading-screen');
    const langModal = document.getElementById('lang-modal');

    const loadingSteps = [
      "Preparing dough...",
      "Mixing chocolate chips...",
      "Preheating the ovens...",
      "Baking fresh cookies...",
      "Almost ready..."
    ];

    const loadInterval = setInterval(() => {
      loadProgress += Math.floor(Math.random() * 15) + 5;
      if (loadProgress >= 100) {
        loadProgress = 100;
        clearInterval(loadInterval);
        loadFill.style.width = '100%';
        loadText.textContent = "Done! 100%";
        
        setTimeout(() => {
          loadScreen.style.opacity = '0';
          setTimeout(() => {
            loadScreen.style.display = 'none';
            langModal.style.display = 'flex';
          }, 600);
        }, 400);
      } else {
        loadFill.style.width = loadProgress + '%';
        const stepIndex = Math.min(Math.floor((loadProgress / 100) * loadingSteps.length), loadingSteps.length - 1);
        loadText.textContent = `${loadingSteps[stepIndex]} ${loadProgress}%`;
      }
    }, 120);

    const i18n = {
      en: {
        cookiesUnit: "cookies",
        perSecond: "per second",
        upgradeTitle: "Upgrades",
        shopTitle: "Buildings",
        tabBuy: "Buy",
        tabSell: "Sell",
        costLabel: "Cost",
        sellLabel: "Sell",
        bakerySuffix: "'s bakery",
        promptName: "Enter your bakery name:",
        langBtnText: "日本語",
        exportSaveText: "Export Save",
        importSaveText: "Import Save",
        exportModalTitle: "Export Save",
        exportLabelDesc: "Copy your save string below:",
        exportBtnCopy: "Copy",
        exportBtnClose: "Close",
        importModalTitle: "Import Save",
        importLabelDesc: "Paste your save string below:",
        importBtnPaste: "Paste",
        importBtnLoad: "Load",
        importBtnClose: "Close",
        copiedAlert: "Save string copied to clipboard!",
        loadSuccessAlert: "Game loaded successfully!",
        loadFailAlert: "Failed to load save string. Invalid format.",
        noUpgradesText: "No upgrades available",
        upgradeEffect: "production doubled!",
        clickUpgradeName: "Reinforced Finger",
        clickUpgradeEffect: "Clicking power doubled!",
        debugTitle: "🛠️ Debug Menu",
        debugCookies: "Cookies:",
        debugCps: "CPS:",
        debugGc: "Golden Cookie Effect:",
        debugSpawnGc: "Spawn GC",
        debugApply: "Apply",
        debugClose: "Close",
        news: {
          tier0: [
            "Your cookies inspire pleasant thoughts.",
            "Neighbors are starting to notice your delicious cookies.",
            "News: Cookies are currently reported as delicious."
          ],

    function getUnlockedTiers(count) {
      const milestones = [5, 10, 15, 25, 50, 75, 100];
      const tiers = [];

      milestones.forEach((m, idx) => {
        if (count >= m) {
          tiers.push(idx + 1);
        }
      });

      if (count >= 150) {
        const extraCount = Math.floor((count - 100) / 50);
        for (let i = 1; i <= extraCount; i++) {
          tiers.push(7 + i);
        }
      }
      return tiers;
    }

    function getUnlockedClickTiers(totalBuildingsCount) {
      const milestones = [10, 25, 50, 75, 100];
      const tiers = [];

      milestones.forEach((m, idx) => {
        if (totalBuildingsCount >= m) {
          tiers.push(idx + 1);
        }
      });

      if (totalBuildingsCount >= 150) {
        const extraCount = Math.floor((totalBuildingsCount - 100) / 50);
        for (let i = 1; i <= extraCount; i++) {
          tiers.push(5 + i);
        }
      }
      return tiers;
    }

    function formatNumberGeneric(num) {
      const scales = [
        { value: 1e36, name: "undecillion" },
        { value: 1e33, name: "decillion" },
        { value: 1e30, name: "nonillion" },
        { value: 1e27, name: "octillion" },
        { value: 1e24, name: "septillion" },
        { value: 1e21, name: "sextillion" },
        { value: 1e18, name: "quintillion" },
        { value: 1e15, name: "quadrillion" },
        { value: 1e12, name: "trillion" },
        { value: 1e9,  name: "billion" },
        { value: 1e6,  name: "million" }
      ];

      for (let scale of scales) {
        if (num >= scale.value) {
          let scaled = num / scale.value;
          return parseFloat(scaled.toFixed(3)) + " " + scale.name;
        }
      }

      return Math.floor(num).toLocaleString(currentLang === 'ja' ? 'ja-JP' : 'en-US');
    }

    function formatCPS(num) {
      const scales = [
        { value: 1e36, name: "undecillion" },
        { value: 1e33, name: "decillion" },
        { value: 1e30, name: "nonillion" },
        { value: 1e27, name: "octillion" },
        { value: 1e24, name: "septillion" },
        { value: 1e21, name: "sextillion" },
        { value: 1e18, name: "quintillion" },
        { value: 1e15, name: "quadrillion" },
        { value: 1e12, name: "trillion" },
        { value: 1e9,  name: "billion" },
        { value: 1e6,  name: "million" }
      ];

      for (let scale of scales) {
        if (num >= scale.value) {
          let scaled = num / scale.value;
          return parseFloat(scaled.toFixed(3)) + " " + scale.name;
        }
      }

      if (Number.isInteger(num)) {
        return num.toLocaleString(currentLang === 'ja' ? 'ja-JP' : 'en-US');
      } else {
        return num.toFixed(1);
      }
    }

    function formatInteger(num) {
      return formatNumberGeneric(num);
    }

    function getBuildingCPS(b) {

    function getTotalCPS() {
      return buildings.reduce((sum, b) => sum + (getBuildingCPS(b) * b.count), 0);
    }

    function getTotalBuildingCount() {
      return buildings.reduce((sum, b) => sum + b.count, 0);
    }

    function getAvailableUpgrades() {
      const list = [];

      buildings.forEach(b => {
        const unlockedTiers = getUnlockedTiers(b.count);
        unlockedTiers.forEach(tier => {
          const key = `${b.id}_${tier}`;
          if (!purchasedUpgrades.has(key)) {
            const cost = b.baseCost * Math.pow(10, tier);
            list.push({
              key: key,
              type: 'building',
              building: b,
              tier: tier,
              cost: cost
            });
          }
        });
      });

      const totalBuildings = getTotalBuildingCount();
      const clickTiers = getUnlockedClickTiers(totalBuildings);
      clickTiers.forEach(tier => {
        const key = `click_${tier}`;
        if (!purchasedUpgrades.has(key)) {
          const cost = 50 * Math.pow(10, tier - 1);
          list.push({
            key: key,
            type: 'click',
            tier: tier,
            cost: cost
          });
        }
      });

      list.sort((a, b) => a.cost - b.cost);

      return list;
    }

                      `${i18n[currentLang].clickUpgradeEffect}\n` +

        btn.title = titleText;

    function buyUpgrade(upg) {
      if (cookies >= upg.cost && !purchasedUpgrades.has(upg.key)) {
        cookies -= upg.cost;

        if (upg.type === 'building') {
          upg.building.multiplier *= 2;
        } else if (upg.type === 'click') {
          cookiesPerClick *= 2;

        updateDisplay();
        renderShop();

    }

        item.className = `building-item ${isDisabled ? 'disabled' : ''}`;
        item.onclick = () => handleBuildingClick(index);

        item.innerHTML = `

    function handleBuildingClick(index) {
      if (shopMode === 'buy') {
        buyBuilding(index);
      } else {
        sellBuilding(index);
      }
    }

    function buyBuilding(index) {
      const b = buildings[index];
      if (cookies >= b.cost) {
        cookies -= b.cost;
        b.count++;
        b.cost = Math.ceil(b.cost * 1.15);

        spawnFallingIcon(b.icon);

        updateDisplay();
        renderShop();
        renderUpgrades();
      }
    }

    function sellBuilding(index) {
      const b = buildings[index];
      if (b.count > 0) {
        const refund = Math.floor(b.cost / 2);
        cookies += refund;
        b.count--;
        b.cost = Math.round(b.cost / 1.15);
        if (b.cost < b.baseCost) {
          b.cost = b.baseCost;
        }

        updateDisplay();
        renderShop();
        renderUpgrades();
      }
    }

    function spawnFallingIcon(iconText) {
      const iconElem = document.createElement('div');
      iconElem.className = 'falling-icon';
      iconElem.textContent = iconText;

      const maxAvailableWidth = window.innerWidth - 420;
      const startX = Math.random() * (maxAvailableWidth - 50);
      const startY = 36;

      iconElem.style.left = `${startX}px`;
      iconElem.style.top = `${startY}px`;

      document.body.appendChild(iconElem);

      let posX = startX;
      let posY = startY;
      let velocityY = 2 + Math.random() * 3;
      let velocityX = (Math.random() - 0.5) * 4;
      let rotation = Math.random() * 360;
      let rotationSpeed = (Math.random() - 0.5) * 10;
      const gravity = 0.6;

      function updateFall() {
        velocityY += gravity;
        posY += velocityY;
        posX += velocityX;
        rotation += rotationSpeed;

        iconElem.style.transform = `translate(${posX - startX}px, ${posY - startY}px) rotate(${rotation}deg)`;

        if (posY > window.innerHeight + 50) {
          iconElem.remove();
        } else {
          requestAnimationFrame(updateFall);
        }
      }

      requestAnimationFrame(updateFall);
    }

    // --- ゴールデンクッキーのロジック実装 ---
    function startGoldenCookieTimer() {
      if (goldenCookieTimer) clearTimeout(goldenCookieTimer);
      const randomTime = (Math.floor(Math.random() * 150) + 90) * 1000; 
      goldenCookieTimer = setTimeout(() => {
        spawnGoldenCookie();
      }, randomTime);
    }

    function spawnGoldenCookie(forcedType = null) {
      if (activeGoldenCookieElement) {
        activeGoldenCookieElement.remove();
      }

      const gc = document.createElement('div');
      gc.className = 'golden-cookie';

      const maxLeft = window.innerWidth - 460; 
      const maxTop = window.innerHeight - 156;
      const randomX = Math.floor(Math.random() * Math.max(50, maxLeft - 100)) + 50;
      const randomY = Math.floor(Math.random() * Math.max(50, maxTop - 100)) + 50;

      gc.style.left = `${randomX}px`;
      gc.style.top = `${randomY}px`;

      gc.onclick = () => {
        clearTimeout(goldenCookieExpireTimer);
        activateGoldenCookie(forcedType);
        removeGoldenCookie(gc);
      };

      gameContainer.appendChild(gc);
      activeGoldenCookieElement = gc;

      goldenCookieExpireTimer = setTimeout(() => {
        removeGoldenCookie(gc);
      }, 13000);
    }

    function removeGoldenCookie(gcElem) {
      if (gcElem && gcElem.parentNode) {
        gcElem.classList.add('fade-out');
        setTimeout(() => {
          if (gcElem.parentNode) {
            gcElem.remove();
          }
          if (activeGoldenCookieElement === gcElem) {
            activeGoldenCookieElement = null;
          }
        }, 500);
      }
      startGoldenCookieTimer();
    }

    function activateGoldenCookie(forcedType = null) {
      const effects = ['frenzy', 'clickFrenzy'];
      const chosenEffect = forcedType || effects[Math.floor(Math.random() * effects.length)];

      if (chosenEffect === 'frenzy') {
        frenzyMultiplier = 7;
        frenzyTimeLeft = 77;
        if (frenzyInterval) clearInterval(frenzyInterval);
        frenzyInterval = setInterval(() => {
          frenzyTimeLeft--;
          if (frenzyTimeLeft <= 0) {
            clearInterval(frenzyInterval);
            frenzyInterval = null;
            frenzyMultiplier = 1;
          }
          updateBuffDisplay();
        }, 1000);
      } else if (chosenEffect === 'clickFrenzy') {
        clickFrenzyMultiplier = 777;
        clickFrenzyTimeLeft = 13;
        if (clickFrenzyInterval) clearInterval(clickFrenzyInterval);
        clickFrenzyInterval = setInterval(() => {
          clickFrenzyTimeLeft--;
          if (clickFrenzyTimeLeft <= 0) {
            clearInterval(clickFrenzyInterval);
            clickFrenzyInterval = null;
            clickFrenzyMultiplier = 1;
          }
          updateBuffDisplay();
        }, 1000);
      }
      updateBuffDisplay();
    }

    function updateBuffDisplay() {
      let texts = [];
      if (frenzyMultiplier > 1) {
        texts.push(currentLang === 'ja' ? `フィンジー！ CPS ×7 (${formatTimeMMSS(frenzyTimeLeft)})` : `Frenzy! CPS x7 (${formatTimeMMSS(frenzyTimeLeft)})`);
      }
      if (clickFrenzyMultiplier > 1) {
        texts.push(currentLang === 'ja' ? `クリックフィンジー！ クリック ×777 (${formatTimeMMSS(clickFrenzyTimeLeft)})` : `Click Frenzy! Click x777 (${formatTimeMMSS(clickFrenzyTimeLeft)})`);
      }
      buffDisplay.textContent = texts.join(' | ');
    }

    cookieBtn.addEventListener('click', (e) => {
      const earned = cookiesPerClick * frenzyMultiplier * clickFrenzyMultiplier;
      cookies += earned;
      totalCookiesEarned += earned;

      updateDisplay();
      renderShop();
      renderUpgrades();

      const rect = cookieBtn.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const numElem = document.createElement('div');
      numElem.className = 'click-number';
      numElem.textContent = `+${formatInteger(earned)}`;
      numElem.style.left = `${clickX}px`;
      numElem.style.top = `${clickY}px`;
      cookieBtn.appendChild(numElem);

      setTimeout(() => {
        numElem.remove();
      }, 800);
    });

    let lastTimestamp = performance.now();
    function gameLoop(timestamp) {
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (delta > 0 && delta < 1) {
        const cps = getTotalCPS();
        const earned = cps * delta * frenzyMultiplier;
        if (earned > 0) {
          cookies += earned;
          totalCookiesEarned += earned;
          updateDisplay();
        }
      }
      requestAnimationFrame(gameLoop);
    }

    function updateDisplay() {
      const unit = i18n[currentLang].cookiesUnit;
      const perSec = i18n[currentLang].perSecond;
      cookiesDisplay.textContent = `${formatNumberGeneric(cookies)} ${unit}`;
      cpsDisplay.textContent = `${perSec}: ${formatCPS(getTotalCPS() * frenzyMultiplier)}`;
    }

    updateBakeryName();
    updateDisplay();
    renderShop();
    renderUpgrades();
    requestAnimationFrame(gameLoop);
  </script>
</body>
