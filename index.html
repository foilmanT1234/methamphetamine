<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>Methamphetamine Login Page</title>
</head>
<body>
  <h1>Methamphetamine - Login</h1>

  <form id="login">
    <label for="password">Password: </label>
    <input type="password" id="password" name="password" required>
    <br>
    <button type="submit">Login</button>
  </form>

  <p id="errMessage" style="color: red; display: none;">Incorrect password. No meth for you.</p>

  <script>
    const form = document.getElementById('login');
    const input = document.getElementById('password');

    const password = "i love meth";

    const targetpage = "homepage.html";

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      if (input.value === password) {
        window.location.href = targetpage; 
      } else {
        document.getElementById('errMessage').style.display = 'block';
      }
    });
  </script>
  
</body>
</html>
